[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-scrapper"
version = "0.1.0"
description = "Fetch Ultra Librarian IC CAD packages and install KiCad symbols, footprints, and 3D models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "web_scrapper contributors" }]
keywords = ["kicad", "ultra-librarian", "eda", "footprint", "symbol", "scraper"]

dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "lxml>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4",
]

[project.scripts]
ulscrape = "ulscrape.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ulscrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit live Ultra Librarian pages",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RET", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ulscrape"]
ignore_missing_imports = true
warn_unused_ignores = false
